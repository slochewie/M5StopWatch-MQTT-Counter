<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Capacity Counter</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #050507;
      --panel: #111116;
      --panel-border: #2a2a33;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --blue: #0a84ff;
      --green: #30d158;
      --red: #ff453a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overscroll-behavior: none;
    }

    .app {
      width: min(100vw, 480px);
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 46px) 28px calc(env(safe-area-inset-bottom) + 34px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3.15rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.055em;
    }

    .location-card {
      margin-top: 18px;
      width: 100%;
      display: grid;
      gap: 8px;
      text-align: left;
    }

    .location-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .location-select {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--panel-border);
      border-radius: 16px;
      background: linear-gradient(180deg, #15151b, #0f0f14);
      color: var(--text);
      padding: 0 14px;
      font-size: 1.05rem;
      font-weight: 650;
      outline: none;
    }

    .location-select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.18);
    }

    #count {
      margin-top: clamp(48px, 10vh, 86px);
      font-size: clamp(7.5rem, 32vw, 11.5rem);
      line-height: 0.82;
      font-weight: 900;
      letter-spacing: -0.08em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      transition: transform 160ms ease, opacity 160ms ease;
      -webkit-user-select: none;
      user-select: none;
    }

    #count.pulse {
      transform: scale(1.075);
      opacity: 0.88;
    }

    .reset-row {
      margin-top: clamp(54px, 8vh, 76px);
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .reset-button {
      width: min(78%, 310px);
      height: 68px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, #178bff, var(--blue));
      box-shadow: 0 14px 30px rgba(10, 132, 255, 0.28);
      color: white;
      font-size: 1.45rem;
      font-weight: 650;
      cursor: pointer;
    }

    .stepper {
      margin-top: clamp(48px, 8vh, 76px);
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .step-button {
      aspect-ratio: 1.08 / 1;
      border: 1.5px solid var(--panel-border);
      border-radius: 25px;
      background: linear-gradient(180deg, #15151b, #0f0f14);
      box-shadow: 0 13px 24px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255,255,255,0.05);
      color: var(--blue);
      font-size: clamp(4.2rem, 18vw, 6.6rem);
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
    }

    .reset-button,
    .step-button,
    .location-select {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .reset-button:active,
    .step-button:active {
      transform: scale(0.97);
      filter: brightness(0.92);
    }

    .connection {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 1.35rem;
      font-weight: 650;
      color: var(--muted);
    }

    .dot {
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 18px rgba(255, 69, 58, 0.45);
    }

    #status.connected {
      color: var(--green);
    }

    #status.connected .dot {
      background: var(--green);
      box-shadow: 0 0 18px rgba(48, 209, 88, 0.45);
    }

    #status.offline {
      color: var(--red);
    }

    .details {
      margin-top: 12px;
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      opacity: 0.72;
    }

    @media (max-height: 720px) {
      .app { padding-top: calc(env(safe-area-inset-top) + 28px); }
      .location-card { margin-top: 14px; }
      #count { margin-top: 34px; }
      .reset-row { margin-top: 38px; }
      .stepper { margin-top: 30px; }
      .reset-button { height: 58px; }
      .connection { font-size: 1.05rem; }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Capacity Counter</h1>

    <div class="location-card">
      <label class="location-label" for="locationSelect">Location</label>
      <select id="locationSelect" class="location-select"></select>
    </div>

    <div id="count">--</div>

    <div class="reset-row">
      <button class="reset-button" type="button" onclick="sendCommand('reset')">Reset</button>
    </div>

    <div class="stepper">
      <button class="step-button" type="button" aria-label="Decrement" onclick="sendCommand('decrement')">−</button>
      <button class="step-button" type="button" aria-label="Increment" onclick="sendCommand('increment')">+</button>
    </div>

    <div id="status" class="connection offline">
      <span class="dot"></span>
      <span class="status-text">Connecting...</span>
    </div>

    <div class="details">
      <div id="topic">Topic: --</div>
      <div id="updated">Last update: --</div>
      <div id="source">Updated by: --</div>
    </div>
  </main>

  <script>
    const MQTT_HOST = "ws://192.168.111.27:9001";
    const MQTT_USER = "mqtt_user";
    const MQTT_PASS = "mqtt_password";

    // Add locations here using the same id values generated from
    // location_presets.private.csv -> components/location_presets/location_presets_generated.cpp.
    const LOCATIONS = [
      { id: "home", name: "Home", mqttHost: "ws://192.168.75.61:9001" },
      { id: "mccarthys", name: "McCarthy's", mqttHost: "ws://192.168.111.27:9001" },
      { id: "library", name: "Library", mqttHost: "ws://192.168.111.27:9001" },
      { id: "frog_peach", name: "Frog & Peach", mqttHost: "ws://192.168.111.27:9001" },
      { id: "bulls", name: "Bull's", mqttHost: "ws://192.168.111.27:9001" }
    ];

    const DEFAULT_LOCATION_ID = "mccarthys";
    const STORAGE_KEY = "capacity_counter_location_id";

    let client = null;
    let activeLocationId = getInitialLocationId();
    let stateTopic = "";
    let commandTopic = "";
    let getTopic = "";

    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const statusTextEl = statusEl.querySelector(".status-text");
    const updatedEl = document.getElementById("updated");
    const sourceEl = document.getElementById("source");
    const topicEl = document.getElementById("topic");
    const locationSelectEl = document.getElementById("locationSelect");

    renderLocationOptions();
    applyLocation(activeLocationId, false);

    client = mqtt.connect((activeLocation().mqttHost || MQTT_HOST), {
      username: MQTT_USER,
      password: MQTT_PASS,
      reconnectPeriod: 2000,
      clean: true,
      clientId: "counter_web_" + Math.random().toString(16).slice(2)
    });

    client.on("connect", () => {
      statusTextEl.textContent = "Connected";
      statusEl.className = "connection connected";
      subscribeToActiveLocation();
    });

    client.on("message", (topic, message) => {
      if (topic !== stateTopic) {
        console.log("Ignoring topic:", topic, message.toString());
        return;
      }

      const raw = message.toString();

      try {
        let data = JSON.parse(raw);

        if (typeof data === "number") {
          data = { value: data, updated_by: "mqtt_numeric" };
        }

        if (data.value !== undefined) {
          countEl.textContent = data.value;

          countEl.classList.remove("pulse");
          void countEl.offsetWidth;
          countEl.classList.add("pulse");

          setTimeout(() => {
            countEl.classList.remove("pulse");
          }, 180);
        }

        updatedEl.textContent = "Last update: " + new Date().toLocaleTimeString();
        sourceEl.textContent = "Updated by: " + (data.source || data.updated_by || "--");

      } catch (e) {
        const numeric = Number(raw);

        if (Number.isFinite(numeric)) {
          countEl.textContent = numeric;
          updatedEl.textContent = "Last update: " + new Date().toLocaleTimeString();
          sourceEl.textContent = "Updated by: mqtt_numeric";
          return;
        }

        console.error("Bad MQTT payload:", raw);
      }
    });

    client.on("offline", () => {
      statusTextEl.textContent = "Offline";
      statusEl.className = "connection offline";
    });

    client.on("error", (err) => {
      statusTextEl.textContent = "MQTT error";
      statusEl.className = "connection offline";
      console.error(err);
    });

    locationSelectEl.addEventListener("change", () => {
      applyLocation(locationSelectEl.value, true);
    });

    function renderLocationOptions() {
      locationSelectEl.innerHTML = "";

      LOCATIONS.forEach((location) => {
        const option = document.createElement("option");
        option.value = location.id;
        option.textContent = location.name || location.id;
        locationSelectEl.appendChild(option);
      });

      locationSelectEl.value = activeLocationId;
    }

    function getInitialLocationId() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get("location");
      const fromStorage = localStorage.getItem(STORAGE_KEY);
      const candidate = fromUrl || fromStorage || DEFAULT_LOCATION_ID;

      return locationExists(candidate) ? candidate : DEFAULT_LOCATION_ID;
    }

    function locationExists(locationId) {
      return LOCATIONS.some((location) => location.id === locationId);
    }

    function activeLocation() {
      return LOCATIONS.find((location) => location.id === activeLocationId) ||
             LOCATIONS.find((location) => location.id === DEFAULT_LOCATION_ID) ||
             LOCATIONS[0];
    }

    function applyLocation(locationId, persist) {
      if (!locationExists(locationId)) {
        locationId = DEFAULT_LOCATION_ID;
      }

      const previousStateTopic = stateTopic;

      activeLocationId = locationId;
      stateTopic = `counters/${activeLocationId}/capacity/state`;
      commandTopic = `counters/${activeLocationId}/capacity/command`;
      getTopic = `counters/${activeLocationId}/capacity/get`;

      locationSelectEl.value = activeLocationId;
      topicEl.textContent = "Topic: " + stateTopic;
      countEl.textContent = "--";
      updatedEl.textContent = "Last update: --";
      sourceEl.textContent = "Updated by: --";

      if (persist) {
        localStorage.setItem(STORAGE_KEY, activeLocationId);

        const url = new URL(window.location.href);
        url.searchParams.set("location", activeLocationId);
        window.history.replaceState({}, "", url);
      }

      if (client && client.connected) {
        if (previousStateTopic && previousStateTopic !== stateTopic) {
          client.unsubscribe(previousStateTopic);
        }

        subscribeToActiveLocation();
      }
    }

    function subscribeToActiveLocation() {
      client.subscribe(stateTopic);
      client.publish(getTopic, JSON.stringify({
        source: "web_page",
        location: activeLocationId
      }));
    }

    function sendCommand(action) {
      if (!client.connected) {
        statusTextEl.textContent = "Offline";
        statusEl.className = "connection offline";
        return;
      }

      client.publish(commandTopic, JSON.stringify({
        action: action,
        source: "web_page",
        location: activeLocationId
      }));
    }

    // iOS/iPadOS Safari:
    // Prevent double-tap zoom only on Reset, Decrement, and Increment buttons.
    // This preserves normal page pinch-to-zoom accessibility.
    (function preventButtonDoubleTapZoom() {
      let lastTapTime = 0;

      document.querySelectorAll(".reset-button, .step-button").forEach((button) => {
        button.addEventListener("touchend", function (event) {
          const now = Date.now();

          if (now - lastTapTime < 350) {
            event.preventDefault();
          }

          lastTapTime = now;
        }, { passive: false });
      });
    })();
  </script>
</body>
</html>
